
      <!DOCTYPE html>
      <html lang="en">
        <head>
          <base href="https://app.bsd.education">
          <title>Lucid — Product Pitch</title>
          
          
          <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" /><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="slides.css" />
          
          
          
        </head>
        <body>
          
  <div class='pitch-deck'>
    <main class='deck-container' id='deck-container' aria-label='Lucid pitch deck'>
      <header class='deck-header'>
        <div class='deck-brand'><span class='brand-mark'></span><span>Lucid</span></div>
        <span class='deck-tag'>Product Pitch</span>
      </header>
      <div class='deck-track' id='deck-track'></div>
      <div class='deck-controls'>
        <button class='nav-arrow' id='prev-btn' aria-label='Previous slide'>←</button>
        <div class='dot-nav' id='dot-nav' aria-label='Slide navigation'></div>
        <span class='slide-count' id='slide-count'>1 / 4</span>
        <button class='nav-arrow' id='next-btn' aria-label='Next slide'>→</button>
      </div>
    </main>
  </div>
  

          
          <script src="slides.js" defer=""></script>
          
        </body>
      </html>
